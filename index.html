<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
    <title>Delizia</title>

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="m-0 p-0">

    <!--Header + landing page -->
    <div class="w-full bg-center bg-no-repeat bg-contain sm:bg-cover md:bg-cover lg:bg-cover"
         style="background-image: url('images/11222.jpg')">

         <!--Header-->
         <header class="py-5">
            <div class="w-full px-4 sm:px-8 md:px-12 lg:px-16 flex justify-between items-center">

                <h1 class="text-yellow-500 text-4xl sm:text-5xl md:text-6xl lg:text-7xl font-bold">
                    Delizia
                </h1>

                <nav class="flex gap-4 lg:gap-6 xl:gap-8">
                    <a href="#Home" class="text-black text-sm
                            lg:text-base transition hover:text-yellow-400">Home</a>
                    <a href="Menu.html" class="text-black text-sm
                            lg:text-base transition hover:text-yellow-400">Menu</a>
                    <a href="About.html" class="text-black text-sm
                            lg:text-base transition hover:text-yellow-400">About</a>
                    <a href="Contact.html" class="text-black text-sm
                            lg:text-base transition hover:text-yellow-400">Contact</a>
                </nav>
                <button class="flex items-center gap-1 sm:gap-2 bg-yellow-500 hover:bg-yellow-400 text-black px-3 py-2 sm:px-4 py-3 lg:px-6 py-3 rounded-lg font-semibold transition">
    
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"stroke-width="2" stroke="currentColor" class="w-5 h-5 sm:w-5 sm:h-5">
                        <path stroke-linecap="round" stroke-linejoin="round"
                        d="M2.25 3h1.386c.51 0 .955.343 1.087.835l.383 1.437m0 0L6.75 14.25a2.25 2.25 0 002.182 1.75h7.136a2.25 2.25 0 002.182-1.75l1.644-6.75H5.106zM9 20.25a.75.75 0 11-1.5 0 .75.75 0 011.5 0zm8.25 0a.75.75 0 11-1.5 0 .75.75 0 011.5 0z"/>
                    </svg>Shop Now
                </button>

            </div>
        </header>

        <!--Landing page-->
         <section class="min-h-[calc(100vh-75px)] sm:min-h-[calc(100vh-80px)] lg:min-h-[calc(100vh-100px)] flex items-center">
    
    <div class="w-full  px-5 sm:px-8 md:px-12 lg:px-16 xl:px-24 -translate-y-8">
        
        <div class="text-white  max-w-[300px] sm:max-w-[400px] md:max-w-[500px] lg:max-w-[600px] ">
            <h2 class="text-3xl md:text-5xl lg:text-6xl font-bold text-yellow-500">
                MADE with <br> A LOT OF LOVE
            </h2>

            <p class="mt-1 sm:mt-4 lg:mt-5 text-sm sm:text-base md:text-lg
                            lg:text-xl leading-relaxed">
                Come and enjoy the delicious
                European pastry, <br> chocolateand coffee.
            </p>

            <button class="mt-2 sm:mt-6 lg:mt-8 bg-yellow-500 hover:bg-yellow-400 hover:scale-105 px-5 py-2.5 sm:px-6 sm:py-3 lg:px-8 rounded-lg font-bold transition duration-300 text-sm
                            sm:text-base
                            lg:text-lg">
                Explore Now
            </button>
        </div>
    </div>

</html>
